<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Geography Notes</title><meta name="theme-color" content="#12324A"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><style>
:root{--paper:#EAF3F5;--card:#FFFFFF;--ink:#12324A;--muted:#4D6A7E;--line:#C9DCE3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0C1F2C;--card:#13293A;--ink:#E3EFF4;--muted:#9DB7C6;--line:#24435A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0C1F2C;--card:#13293A;--ink:#E3EFF4;--muted:#9DB7C6;--line:#24435A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 "Source Serif 4",Georgia,serif}h1,h2,h3,button,input,.chip,.meta,.badge{font-family:"Bricolage Grotesque",system-ui,sans-serif}header{max-width:900px;margin:0 auto;padding:30px 16px 10px}h1{font-size:clamp(2.4rem,9vw,4rem);line-height:.95;margin:0 0 8px;font-weight:800;letter-spacing:-.03em}header p{margin:0;color:var(--muted)}.search{margin:18px 0 8px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:1rem}.search:focus{border-color:var(--ink);outline:none}.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:5px 13px;font-weight:700;font-size:.85rem;cursor:pointer}.chip[aria-pressed="true"]{background:var(--c);color:#fff}main{max-width:900px;margin:0 auto;padding:4px 16px 80px}h2{font-size:1.35rem;margin:26px 0 10px;color:var(--c);display:flex;align-items:center;gap:8px}h2 small{font-size:.8rem;color:var(--muted);font-weight:500}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--c)}a.card:hover{border-color:var(--c)}.card .emo{font-size:1.8rem;line-height:1}.card h3{margin:8px 0 4px;font-size:1.2rem;line-height:1.2}.card p{margin:0;color:var(--muted);font-size:.92rem}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}.card.soon{opacity:.6}.card.soon .badge{background:var(--line);color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:40px 0}.err{background:#FFF4DC;color:#8A5A00;border-radius:12px;padding:12px;margin-top:20px;font-size:.92rem}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 16px 30px}.themebtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}:focus-visible{outline:3px solid #E9A23B;outline-offset:2px}.mtabs{display:flex;gap:8px;margin:16px 0 0}.mtabs button{flex:1;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;padding:10px;font:800 1rem "Bricolage Grotesque",sans-serif;cursor:pointer}.mtabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}.chno{font:800 .8rem "Bricolage Grotesque",sans-serif;color:var(--c)}
</style></head><body>
<header><h1>Geography<br>Notes</h1><p>Saare interactive notes, flashcards aur MCQs ek jagah. Offline bhi chalega.</p><div class="mtabs" id="mainTabs" role="tablist" aria-label="Content type"><button role="tab" data-mt="notes">📒 Notes</button><button role="tab" data-mt="book">📖 Book</button><button role="tab" data-mt="papers">📝 Papers</button><button role="tab" data-mt="self">✍️ Self</button></div><input class="search" id="q" type="search" placeholder="Topic search karo… (jaise tides, coral, monsoon)" aria-label="Search notes"><div class="chips" id="chips"></div></header>
<main id="list"><p class="empty">Loading…</p></main><footer>Naye notes: HTML file repo me daalo + <code>notes.json</code> me ek entry.</footer><button class="themebtn" id="theme" aria-label="Toggle dark mode">◐</button>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=["#2F7FD1","#E8505B","#1BA3A3","#6A4FC2","#E9A23B","#2E9E6E","#E2607E","#8A6A3F","#2E5E8C"];
let DATA=[],sub="all",mt=["#book","#papers","#self"].includes(location.hash)?location.hash.slice(1):store.get("hub-tab","notes");
const inTab=n=>(n.tab||"notes")===mt;
function setTab(t){mt=t;sub="all";store.set("hub-tab",t);history.replaceState(null,"",t==="notes"?"#":"#"+t);document.querySelectorAll("#mainTabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mt===t));$("#q").placeholder=t==="book"?"Chapter search karo… (jaise glacier, cirque)":t==="papers"?"Paper search karo… (jaise UGC NET)":t==="self"?"Apna material search karo…":"Topic search karo… (jaise tides, coral, monsoon)";chips();render();}
function colorOf(s){const subs=[...new Set(DATA.map(n=>n.subject))];return COLORS[subs.indexOf(s)%COLORS.length];}
function chips(){const c=$("#chips");c.innerHTML="";const subs=[...new Set(DATA.filter(inTab).map(n=>n.subject))];const mk=(k,l,col)=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.style.setProperty("--c",col);b.setAttribute("aria-pressed",sub===k);b.onclick=()=>{sub=k;chips();render();};c.appendChild(b);};mk("all",mt==="book"?"Saari books":mt==="papers"?"Saare papers":mt==="self"?"Sab material":"Sab","var(--ink)");subs.forEach(s=>mk(s,s,colorOf(s)));}
function render(){const term=$("#q").value.trim().toLowerCase();const L=$("#list");L.innerHTML="";const groups={};DATA.filter(inTab).sort((a,b)=>(a.chapter||0)-(b.chapter||0)).forEach(n=>{if(sub!=="all"&&n.subject!==sub)return;const hay=(n.title+" "+n.subject+" "+(n.topics||[]).join(" ")+" "+(n.desc||"")).toLowerCase();if(term&&!hay.includes(term))return;(groups[n.subject]=groups[n.subject]||[]).push(n);});const keys=Object.keys(groups);if(!keys.length){L.innerHTML=mt==="book"&&!term?"<p class='empty'>Abhi koi book chapter nahi.</p>":"<p class='empty'>Kuch nahi mila. Doosra word try karo.</p>";return;}keys.forEach(s=>{const col=colorOf(s);const h=document.createElement("h2");h.style.setProperty("--c",col);h.textContent=s+" ";const sm=document.createElement("small");sm.textContent=groups[s].length+" notes";h.appendChild(sm);const g=document.createElement("div");g.className="grid";groups[s].forEach(n=>{const soon=!n.file;const el=document.createElement(soon?"div":"a");el.className="card"+(soon?" soon":"");el.style.setProperty("--c",col);if(!soon)el.href=n.file;el.innerHTML="<div class='emo'></div><h3></h3><p></p><div class='meta'></div>";el.querySelector(".emo").textContent=n.emoji||"📘";el.querySelector("h3").textContent=n.title;if(n.chapter){const c=document.createElement("div");c.className="chno";c.textContent="Chapter "+n.chapter;el.insertBefore(c,el.querySelector("h3"));}el.querySelector("p").textContent=n.desc||"";const m=el.querySelector(".meta");const tags=soon?["Jald aa raha"]:[...(n.mcq?[n.mcq+" MCQs"]:[]),...(n.flashcards?[n.flashcards+" flashcards"]:[]),...(n.source?[n.source]:[])];tags.forEach(t=>{const b=document.createElement("span");b.className="badge";b.textContent=t;m.appendChild(b);});g.appendChild(el);});L.appendChild(h);L.appendChild(g);});}
document.querySelectorAll("#mainTabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.mt));
fetch("notes.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{if(!Array.isArray(d))throw Error("Expected JSON array");DATA=d;setTab(mt);}).catch(()=>{$("#list").innerHTML="<div class='err'>notes.json load nahi hua. Check karo ki file repo ke root me hai aur JSON sahi hai (comma/bracket). Local file direct open karne ki jagah website server se kholo.</div>";});
$("#q").addEventListener("input",render);$("#theme").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";store.set("hub-theme",r.dataset.theme);};const th=store.get("hub-theme",null);if(th)document.documentElement.dataset.theme=th;if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
